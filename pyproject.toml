[project]
name = "freelance-parser"
version = "0.1.0"
description = "fl.ru freelance project monitor with Telegram alerts and Claude-drafted proposals"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.103.1",
    "feedparser>=6.0.12",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.2",
    "python-telegram-bot[job-queue]>=22.7",
    "pyyaml>=6.0.3",
    "selectolax>=0.4.9",
]

[project.scripts]
freelance-parser = "freelance_parser:main"

[build-system]
requires = ["uv_build>=0.11.13,<0.12.0"]
build-backend = "uv_build"
